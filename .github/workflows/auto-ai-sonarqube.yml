name: Auto AI SonarQube Fix

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

env:
  SONAR_PROJECT_KEY: my-project-key
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  BUILD_COMMAND: ./gradlew build
  TEST_COMMAND: ./gradlew test
  SONAR_SCANNER_CMD: sonar-scanner
  AI_FIX_BRANCH_PREFIX: auto-ai-fix
  EMAIL_RECIPIENTS: ${{ secrets.AI_PR_EMAIL_RECIPIENTS }}

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install SonarScanner
        run: |
          SONAR_SCANNER_VERSION=8.1.0.6389
          SONAR_SCANNER_FLAVOR=linux-x64
          wget -q -O /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-${SONAR_SCANNER_FLAVOR}.zip
          unzip -q /tmp/sonar-scanner.zip -d /tmp
          echo "/tmp/sonar-scanner-${SONAR_SCANNER_VERSION}-${SONAR_SCANNER_FLAVOR}/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Secrets diagnostics
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          if [ -n "$GITHUB_HEAD_REF" ]; then
            echo "Pull request detected: GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          fi
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "*** NOTICE: SonarQube secrets are empty in this runner environment." 
            echo "Possible causes:" 
            echo "- Repository secrets 'SONAR_HOST_URL' and 'SONAR_TOKEN' are not configured." 
            echo "- This run is from a forked repo or a pull request from a fork (secrets are masked for security)." 
            echo "- The workflow was triggered by a user who does not have access to secrets (e.g., workflow_dispatch from a fork)." 
            echo "If this is a PR from a fork, re-run on the base repository or set secrets in the base repo settings."
          else
            echo "SONAR_HOST_URL and SONAR_TOKEN are present (masked)."
          fi

      - name: Validate SonarQube settings
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: Missing SonarQube secrets. Please set SONAR_HOST_URL and SONAR_TOKEN."
            exit 1
          fi
          echo "SONAR_HOST_URL is set"

      - name: Run SonarQube scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running SonarQube scan"
          ${SONAR_SCANNER_CMD} -Dsonar.projectKey="${SONAR_PROJECT_KEY}" -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.login="$SONAR_TOKEN"

      - name: Run AI auto-fix agent
        run: |
          python scripts/auto_ai_fix.py
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ secrets.GITHUB_API_URL || 'https://api.github.com' }}
          REPO_DIR: ${{ github.workspace }}
          GIT_REMOTE: origin
          AI_FIX_BRANCH_PREFIX: auto-ai-fix
          TARGET_BRANCH: main
          EMAIL_RECIPIENTS: ${{ secrets.AI_PR_EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'true' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
